<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="Outfit, DM Sans, Helvetica, Arial, sans-serif">
  <rect width="960" height="330" rx="18" fill="#DED7CD"/>
  <text x="30" y="44" font-size="24" font-weight="700" fill="#191919">What goes on the air</text>

  <!-- Google: 29 bytes, scale 30 px/byte from x=30 -->
  <text x="30" y="88" font-size="15" font-weight="700" fill="#028AC2">Google Find Hub (29 bytes)</text>
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="100" width="90" height="44" rx="6" fill="#fff"/><text x="75" y="120" fill="#191919">02 01 06</text><text x="75" y="136" fill="#191919" opacity="0.6">flags</text>
    <rect x="124" y="100" width="60" height="44" rx="6" fill="#fff"/><text x="154" y="120" fill="#191919">19 16</text><text x="154" y="136" fill="#191919" opacity="0.6">svc data</text>
    <rect x="188" y="100" width="60" height="44" rx="6" fill="#028AC2"/><text x="218" y="120" fill="#fff">AA FE</text><text x="218" y="136" fill="#fff">0xFEAA</text>
    <rect x="252" y="100" width="40" height="44" rx="6" fill="#FFAC00"/><text x="272" y="120" fill="#191919">41</text><text x="272" y="136" fill="#191919">frame</text>
    <rect x="296" y="100" width="560" height="44" rx="6" fill="#191919"/><text x="576" y="120" fill="#fff">EID: 20 bytes = x of r·G on SECP160R1</text><text x="576" y="136" fill="#DED7CD">r = AES-256(EIK, time slot) mod n, new every 1024 s</text>
    <rect x="860" y="100" width="70" height="44" rx="6" fill="#fff"/><text x="895" y="120" fill="#191919">flags</text><text x="895" y="136" fill="#191919" opacity="0.6">hashed</text>
  </g>
  <text x="30" y="166" font-size="12" fill="#191919" opacity="0.75">Address: a non-resolvable private address taken from SHA-256(EID). It changes with the EID.</text>

  <!-- Apple -->
  <text x="30" y="214" font-size="15" font-weight="700" fill="#191919">Apple Find My, OpenHaystack (31 bytes)</text>
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="226" width="60" height="44" rx="6" fill="#fff"/><text x="60" y="246" fill="#191919">1E FF</text><text x="60" y="262" fill="#191919" opacity="0.6">mfg data</text>
    <rect x="94" y="226" width="60" height="44" rx="6" fill="#191919"/><text x="124" y="246" fill="#fff">4C 00</text><text x="124" y="262" fill="#fff">Apple</text>
    <rect x="158" y="226" width="80" height="44" rx="6" fill="#FFAC00"/><text x="198" y="246" fill="#191919">12 19 00</text><text x="198" y="262" fill="#191919">offline find</text>
    <rect x="242" y="226" width="590" height="44" rx="6" fill="#191919"/><text x="537" y="246" fill="#fff">public key bytes 6-27 (22 bytes)</text><text x="537" y="262" fill="#DED7CD">P-224 x coordinate; the private key stays with you</text>
    <rect x="836" y="226" width="94" height="44" rx="6" fill="#fff"/><text x="883" y="246" fill="#191919">k0&gt;&gt;6, 00</text><text x="883" y="262" fill="#191919" opacity="0.6">bits, hint</text>
  </g>
  <text x="30" y="292" font-size="12" fill="#191919" opacity="0.75">Address: a static random address made of key bytes 0-5 (top two bits set). Together with the advert, the iPhone has the whole key.</text>
</svg>
